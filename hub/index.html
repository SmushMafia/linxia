<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smushO</title>
<!-- 版本切换站：base + 每个孩子的最新版。孩子列表在 kids.json，由 tools/new-kid.sh 维护 -->
<style>
  :root{ --bg:#faf6ef; --fg:#3c3528; --muted:#8a8070; --border:#e5dcc8; --on:#f08c1e; --chip:#ffffff; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#17150f; --fg:#efe8d8; --muted:#9a917d; --border:#3a352a; --chip:#211e15; color-scheme:dark; }
  }
  :root[data-theme="dark"]{ --bg:#17150f; --fg:#efe8d8; --muted:#9a917d; --border:#3a352a; --chip:#211e15; color-scheme:dark; }
  html,body{margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,"PingFang SC",sans-serif}
  body{display:flex; flex-direction:column}
  nav{display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 16px; border-bottom:1.5px solid var(--border)}
  nav button, nav a{font:inherit; font-size:15px; padding:6px 14px; border-radius:999px; border:1.5px solid var(--border);
    background:var(--chip); color:var(--fg); cursor:pointer; text-decoration:none}
  nav button[aria-pressed="true"]{background:var(--on); border-color:var(--on); color:#fff}
  nav .sp{flex:1}
  nav .tool{color:var(--muted); font-size:14px}
  iframe{flex:1; width:100%; border:0}
</style>

<nav id="tabs">
  <span class="sp"></span>
  <button class="tool" id="reload" title="Pages 有几分钟缓存，刚推送的版本没出来就点这个">刷新</button>
  <a class="tool" id="open" target="_blank" rel="noopener">新窗口打开</a>
</nav>
<iframe id="game" title="游戏" allow="fullscreen"></iframe>

<script>
const tabs = document.getElementById('tabs'), game = document.getElementById('game'), open = document.getElementById('open');
const urlOf = k => k.repo ? `https://${k.repo.split('/')[0].toLowerCase()}.github.io/${k.repo.split('/')[1]}/` : k.url;
let list = [], cur = 0;

function show(i, bust){
  cur = i; location.hash = list[i].id;
  const u = urlOf(list[i]);
  game.src = bust ? u + '?t=' + Date.now() : u;
  open.href = u;
  tabs.querySelectorAll('[data-i]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === i));
  game.focus(); // 键盘输入要落到 iframe 里
}

fetch('kids.json', { cache:'no-store' }).then(r => r.json()).catch(() => []).then(kids => {
  list = [{ id:'base', name:'base', url:'../' }, ...kids];
  const sp = tabs.querySelector('.sp');
  list.forEach((k, i) => {
    const b = document.createElement('button'); b.dataset.i = i; b.textContent = k.name;
    b.onclick = () => show(i);
    tabs.insertBefore(b, sp);
  });
  const h = list.findIndex(k => k.id === location.hash.slice(1));
  show(h < 0 ? 0 : h);
});
document.getElementById('reload').onclick = () => show(cur, true);
game.addEventListener('load', () => game.focus());
</script>
